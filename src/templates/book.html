<header class="book-header">
    <a class="back" href="album.html">< Назад к альбому</a>
    <div class="titles">
      <p class="eyebrow">Vanik &amp; Arina</p>
      <h1>Наша история</h1>
      <p class="lede">Листай страницы, смотри фото, читай заметки.</p>
    </div>
    <div class="header-meta" id="headerMeta">0 разворотов</div>
  </header>

  <main class="book-layout">
    <section class="book-frame" aria-label="Книга">
      <div id="book" aria-live="polite"></div>
      <div class="book-shadow" aria-hidden="true"></div>
      <div class="love-ambient" aria-hidden="true">
        <span>❤</span><span>♥</span><span>❤</span><span>♥</span><span>❤</span><span>♥</span>
      </div>
    </section>
    <aside class="notes-panel" aria-label="Заметки для текущего разворота">
      <div class="notes-head">
        <div id="noteTitle">Выберите страницу</div>
        <div id="noteDate"></div>
      </div>
      <div id="noteText" class="note-text">Здесь будут заметки для выбранного разворота.</div>
    </aside>
  </main>

  <div class="controls">
    <div class="left">
      <button id="prevPage" class="pill" title="Предыдущая страница">‹</button>
      <button id="nextPage" class="pill" title="Следующая страница">›</button>
    </div>
    <div class="center" id="pageIndicator">-- / --</div>
    <div class="right">
      <button id="autoPlay" class="ghost pill" aria-pressed="false" title="Автопрокрутка">Автопрокрутка</button>
    </div>
  </div>

  <div id="bookViewer" hidden>
    <button class="close" aria-label="Закрыть">×</button>
    <img alt="" />
  </div>
